[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kilix-transcript-clean"
version = "0.1.0"
description = "Readable text from recorded kilix pane transcripts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "itsmygithubacct" }]
dependencies = []

[project.scripts]
kilix-transcript-clean = "kilix_transcript_clean.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kilix_transcript_clean"]
